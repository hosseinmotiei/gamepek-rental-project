version: '3.8'

services:
  app:
    image: php:8.2-fpm
    container_name: gamepek_rental_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
    depends_on:
      - mysql
      - redis
    networks:
      - gamepek_rental_net

  nginx:
    image: nginx:alpine
    container_name: gamepek_rental_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gamepek_rental_net

  mysql:
    image: mysql:8.0
    container_name: gamepek_rental_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gamepek_rental
      MYSQL_USER: gamepek_rental_user
      MYSQL_PASSWORD: gamepek_rental_pass
    volumes:
      - gamepek_rental_mysql_data:/var/lib/mysql
    networks:
      - gamepek_rental_net

  redis:
    image: redis:7-alpine
    container_name: gamepek_rental_redis
    ports:
      - "6379:6379"
    networks:
      - gamepek_rental_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gamepek_rental_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - mysql
    networks:
      - gamepek_rental_net

volumes:
  gamepek_rental_mysql_data:

networks:
  gamepek_rental_net:
    driver: bridge
